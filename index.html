<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- ✅ PWA Essential -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#CC0033">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PLAYTV">
  <meta name="description" content="PLAYTV — ดูทีวีออนไลน์ รองรับทุกฟอร์แมต">
  
  <!-- ✅ ไอคอน PWA -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">


  <style>
    :root {
      --bg: #0f1218; --s1: #1a1f2b; --s2: #242a38; --s3: #2e3546;
      --accent: #92c83e; --accent2: #7ab627; --text: #ffffff; --muted: #9ca3af;
      --ok: #22c55e; --err: #ef4444;
      --cat-active: #84cc16;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    .hidden { display: none !important; }

    .top-bar {
      background: linear-gradient(180deg, rgba(0,0,0,0.95), rgba(0,0,0,0.7));
      padding: 12px 16px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .top-link {
      color: #ff0000;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 4px;
      display: inline-block;
    }
    .top-link.pink { color: #ff69b4; }
    .date-time {
      color: #fff;
      font-size: 14px;
      line-height: 1.5;
    }
    .logo-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(0,0,0,0.4);
    }
    .play-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #000;
      font-weight: bold;
    }
    .logo-text {
      font-size: 22px;
      font-weight: 900;
      color: var(--accent);
    }

    .open-cat-btn {
      position: fixed;
      top: 130px;
      left: 16px;
      z-index: 50;
      background: var(--s2);
      color: var(--text);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .open-cat-btn:active { background: var(--s3); }

    .category-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 300px;
      max-width: 90vw;
      height: 100vh;
      background: var(--s1);
      border-left: 1px solid rgba(255,255,255,0.1);
      z-index: 200;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 20px rgba(0,0,0,0.5);
    }
    .category-sidebar.open { transform: translateX(0); }
    
    .cat-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cat-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .cat-close {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }
    .cat-close:hover { color: #fff; }

    .cat-list {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
    }
    .cat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      font-size: 15px;
      color: var(--muted);
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    .cat-item:hover {
      background: var(--s2);
      color: var(--text);
    }
    .cat-item.active {
      background: var(--cat-active);
      color: #000;
      font-weight: 600;
      border-color: #65a30d;
    }
    .cat-icon {
      font-size: 20px;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .cat-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 199;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }
    .cat-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .player-area {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .player-placeholder {
      font-size: 64px;
      color: #444;
    }
    video {
      width: 100%;
      height: 100%;
      background: #000;
      display: block;
      outline: none;
    }
    .player-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .control-left, .control-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 14px;
      color: #ccc;
    }
    .control-btn {
      background: transparent;
      border: none;
      color: #ccc;
      font-size: 20px;
      cursor: pointer;
    }
    .moon-btn {
      background: #fbbf24;
      color: #000;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .menu-btn {
      background: var(--accent);
      color: #000;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .channel-section {
      padding: 16px;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .section-title {
      font-size: 15px;
      color: var(--muted);
    }
    .playlist-tabs {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .tab-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: var(--s2);
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
    }
    .add-playlist-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #000;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .search-box {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--s3);
      background: var(--s1);
      color: var(--text);
      font-size: 14px;
      width: 180px;
    }

    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
    }
    @media (min-width: 768px) {
      .channel-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }
    .channel-card {
      background: var(--s1);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    .channel-card:hover, .channel-card.active {
      background: var(--s2);
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .channel-logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 8px;
      border-radius: 8px;
      background: var(--s2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      overflow: hidden;
    }
    .channel-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .channel-name {
      font-size: 13px;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 20px;
    }
    .modal-box {
      width: 100%;
      max-width: 480px;
      background: var(--s1);
      border-radius: 16px;
      overflow: hidden;
    }
    .modal-head {
      padding: 16px 20px;
      background: var(--s2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-head h3 {
      font-size: 17px;
      font-weight: 600;
    }
    .modal-close {
      border: none;
      background: transparent;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }
    .modal-body {
      padding: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .form-input, .form-file {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--s3);
      background: var(--s2);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #000;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .status-text {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .status-ok { color: var(--ok); }
    .status-err { color: var(--err); }

    .app-btn {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background: #ea4335;
      color: white;
      font-size: 14px;
      cursor: pointer;
      margin-right: 10px;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="https://kicksball.com/tv" class="top-link">เข้าสู่เว็บไซต์ / ENTER SIT</a>
  <a href="https://sugus25.github.io/IPTV/" class="top-link pink">sugus25</a>
  <div class="date-time">
    <span id="thaiDate"></span><br>
    <span id="thaiTime"></span>
  </div>
</div>

<div class="logo-header">
  <div class="play-icon">▶</div>
  <div class="logo-text">PLAY TV</div>
</div>

<button class="open-cat-btn" id="openCatBtn">📂 หมวดหมู่</button>

<div class="cat-overlay" id="catOverlay"></div>
<div class="category-sidebar" id="catSidebar">
  <div class="cat-header">
    <span class="cat-title">หมวดหมู่</span>
    <button class="cat-close" id="closeCat">×</button>

    <div class="control-left">
      <span id="timeDisplay">0:00</span>
    </div>
    <div class="control-right">
      <button class="control-btn">🔊</button>
      <button class="control-btn">⛶</button>

      <button class="control-btn menu-btn">เมนู</button>

  </div>
</div>

<div class="channel-section">
  <div class="section-header">
    <div class="section-title">ช่องรายการ</div>
    <div class="playlist-tabs">
      <button class="tab-btn active" data-playlist="default" id="playlistTab">PLAYTV (0)</button>
      <button class="add-playlist-btn" id="addPlaylistBtn">➕ เพิ่มเพลย์ลิสต์</button>

      <h3>ยังไม่มีเพลย์ลิสต์</h3>
      <p>กดปุ่ม "➕ เพิ่มเพลย์ลิสต์" เพื่อเริ่มใช้งาน<br>รองรับ: .m3u / .m3u8 / .json / .w3u</p>
    </div>

</div>

<div class="modal-overlay hidden" id="addModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>📂 เพิ่มเพลย์ลิสต์</h3>
      <button class="modal-close" id="closeAddModal">×</button>

      <div class="form-group">

<div class="modal-overlay hidden" id="playerModal">
  <div class="modal-box" style="max-width: 800px;">
    <div class="modal-head">
      <h3 id="playerTitle">วิดีโอ</h3>
      <button class="modal-close" id="closePlayer">×</button>
    </div>
    <div style="padding: 0;">
      <video id="modalVideo" controls playsinline style="width: 100%; background: #000;"></video>
      <div style="padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 10px;">
        <button class="app-btn" id="openInAppBtn">📱 เปิดในแอปอื่น</button>
        <button style="padding: 10px 14px; border-radius: 8px; border: none; background: var(--s2); color: white; cursor: pointer;" id="copyBtn">📋 คัดลอกลิงก์</button>
      </div>
      <div id="playerErr" style="padding: 0 20px 16px; color: var(--err); display: none;">❌ ไม่สามารถเล่นสตรีมนี้ได้</div>
    </div>
  </div>
</div>

<script>
function updateDateTime() {
  const today = new Date();
  const weekDays = ['วันอาทิตย์', 'วันจันทร์', 'วันอังคาร', 'วันพุธ', 'วันพฤหัสบดี', 'วันศุกร์', 'วันเสาร์'];
  const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  const buddhistYear = today.getFullYear() + 543;
  const dateStr = `${weekDays[today.getDay()]} ที่ ${today.getDate()} เดือน${months[today.getMonth()]} พ.ศ. ${buddhistYear}`;
  const timeStr = today.toLocaleTimeString('th-TH', { hour12: false });
  
  document.getElementById('thaiDate').textContent = dateStr;
  document.getElementById('thaiTime').textContent = timeStr;
}
updateDateTime();
setInterval(updateDateTime, 1000);

const catSidebar = document.getElementById('catSidebar');
const catOverlay = document.getElementById('catOverlay');
const openCatBtn = document.getElementById('openCatBtn');
const closeCat = document.getElementById('closeCat');

function toggleCatMenu() {
  catSidebar.classList.toggle('open');
  catOverlay.classList.toggle('active');
}
openCatBtn.addEventListener('click', toggleCatMenu);
closeCat.addEventListener('click', toggleCatMenu);
catOverlay.addEventListener('click', toggleCatMenu);

let hls = null, dashPlayer = null;
let currentFullUrl = '';
let allChannels = [];
let allGroups = new Set();
let activeGroup = 'all';

function rebuildCategories() {
  const catList = document.getElementById('catList');
  catList.innerHTML = `
    <div class="cat-item ${activeGroup === 'all' ? 'active' : ''}" data-group="all">
      <span class="cat-icon">📋</span>
      <span>ทั้งหมด (${allChannels.length})</span>
    </div>
  `;
  
  allGroups.forEach(groupName => {
    const count = allChannels.filter(c => c.group === groupName).length;
    const div = document.createElement('div');
    div.className = `cat-item ${activeGroup === groupName ? 'active' : ''}`;
    div.dataset.group = groupName;
    div.innerHTML = `
      <span class="cat-icon">${getGroupIcon(groupName)}</span>
      <span>${groupName} (${count})</span>
    `;
    div.addEventListener('click', () => {
      activeGroup = groupName;
      renderChannels();
      toggleCatMenu();
    });
    catList.appendChild(div);
  });

  catList.querySelector('[data-group="all"]').addEventListener('click', () => {
    activeGroup = 'all';
    renderChannels();
    toggleCatMenu();
  });
}

function getGroupIcon(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('ไทย') || n.includes('thai')) return '🇹🇭';
  if (n.includes('กีฬา') || n.includes('sport')) return '⚽';
  if (n.includes('หนัง') || n.includes('movie') || n.includes('บันเทิง')) return '🎬';
  if (n.includes('ข่าว') || n.includes('news')) return '📰';
  if (n.includes('การ์ตูน')) return '🧸';
  if (n.includes('ต่างประเทศ')) return '🌍';
  if (n.includes('ใหม่') || n.includes('new')) return '🔥';
  return '📁';
}

function renderChannels(searchKeyword = '') {
  const grid = document.getElementById('channelGrid');
  grid.innerHTML = '';
  
  let list = allChannels;
  if (activeGroup !== 'all') list = list.filter(ch => ch.group === activeGroup);
  if (searchKeyword) list = list.filter(ch => ch.name.toLowerCase().includes(searchKeyword.toLowerCase()));

  if (list.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${allChannels.length === 0 ? '📂' : '🔍'}</div>
        <h3>${allChannels.length === 0 ? 'ยังไม่มีเพลย์ลิสต์' : 'ไม่พบช่อง'}</h3>
        <p>${allChannels.length === 0 ? 'กดปุ่ม "➕ เพิ่มเพลย์ลิสต์" เพื่อเริ่มใช้งาน' : ''}</p>
      </div>
    `;
    return;
  }

  list.forEach((ch) => {
    const card = document.createElement('div');
    card.className = 'channel-card';
    const logoUrl = ch.logo || '';
    const fallbackIcon = ch.name.charAt(0) || '📺';
    
    card.innerHTML = `
      <div class="channel-logo">
        ${logoUrl ? `<img src="${logoUrl}" alt="${ch.name}" loading="lazy" onerror="this.style.display='none'">` : `<span>${fallbackIcon}</span>`}
      </div>
      <div class="channel-name">${ch.name}</div>
    `;
    card.addEventListener('click', () => openPlayer(ch));
    grid.appendChild(card);
  });
}

function updateTabCount() {
  document.getElementById('playlistTab').textContent = `PLAYTV (${allChannels.length})`;
}

// ✅ แยก URL กับ Referer
function parseUrlAndReferer(fullUrl) {
  let url = fullUrl, referer = '';
  
  if (fullUrl.includes('|referer=')) {
    const parts = fullUrl.split('|referer=');
    url = parts[0];
    referer = parts[1] || '';
  }
  else if (fullUrl.includes('?referer=')) {
    const parts = fullUrl.split('?referer=');
    url = parts[0];
    referer = parts[1] || '';
  }
  
  return { url, referer };
}

function openPlayer(channel) {
  currentFullUrl = channel.url;
  const { url, referer } = parseUrlAndReferer(channel.url);
  
  document.getElementById('playerTitle').textContent = channel.name;
  document.getElementById('playerModal').classList.remove('hidden');
  document.getElementById('playerErr').style.display = 'none';
  playVideo(url, referer);
}

function playVideo(url, referer = '') {
  stopAllPlayers();
  const video = document.getElementById('modalVideo');

  if (url.includes('.m3u8') || url.includes('m3u8')) {
    if (Hls.isSupported()) {
      hls = new Hls({
        xhrSetup: (xhr) => {
          if (referer) xhr.setRequestHeader('Referer', referer);
        }
      });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      hls.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) document.getElementById('playerErr').style.display = 'block';
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play().catch(() => {});
    }
  }
  else if (url.includes('.mpd') || url.includes('mpd')) {
    dashPlayer = dashjs.MediaPlayer().create();
    dashPlayer.initialize(video, url, true);
  }
  else {
    video.src = url;
    video.play().catch(() => {
      document.getElementById('playerErr').style.display = 'block';
    });
  }
}

function stopAllPlayers() {
  const video = document.getElementById('modalVideo');
  video.pause();
  video.removeAttribute('src');
  if (hls) { hls.destroy(); hls = null; }
  if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }
}

document.getElementById('closePlayer').addEventListener('click', () => {
  document.getElementById('playerModal').classList.add('hidden');
  stopAllPlayers();
});

// ✅ เปิดในแอปอื่น — ส่ง S.referer แยกต่างหาก ไม่ encode!
document.getElementById('openInAppBtn').addEventListener('click', () => {
  if (!currentFullUrl) return alert('ไม่มีลิงก์วิดีโอ');
  
  const { url, referer } = parseUrlAndReferer(currentFullUrl);
  
  let mimeType = 'video/*';
  if (url.includes('.m3u8')) mimeType = 'application/vnd.apple.mpegurl';
  else if (url.includes('.mpd')) mimeType = 'video/mp4';

  // ✅ ส่ง URL ปกติ + ส่ง Referer ผ่าน S.referer= แยกต่างหาก — ไม่ encode เลย!
  let intentUrl = `intent://${url.replace(/^https?:\/\//, '')}#Intent;` +
    `scheme=https;` +
    `type=${mimeType};`;
  
  // ✅ ส่ง referer แบบข้อความตรงๆ ไม่ผ่าน encodeURIComponent — แอปอ่านง่ายที่สุด
  if (referer) {
    intentUrl += `S.referer=${referer};`;
  }
  
  intentUrl += `end`;

  console.log('✅ ส่ง Intent:', intentUrl);
  window.location.href = intentUrl;
});

// ✅ คัดลอกลิงก์ — คืนรูปแบบเดิม
document.getElementById('copyBtn').addEventListener('click', () => {
  if (!currentFullUrl) return alert('ไม่มีลิงก์');
  navigator.clipboard.writeText(currentFullUrl).then(() => alert('✅ คัดลอกลิงก์แล้ว'));
});

document.getElementById('addPlaylistBtn').addEventListener('click', () => {
  document.getElementById('addModal').classList.remove('hidden');
  document.getElementById('loadStatus').textContent = '';
  document.getElementById('playlistUrl').value = '';
  document.getElementById('playlistFile').value = '';
});
document.getElementById('closeAddModal').addEventListener('click', () => {
  document.getElementById('addModal').classList.add('hidden');
});
document.getElementById('addModal').addEventListener('click', (e) => {
  if (e.target.id === 'addModal') document.getElementById('addModal').classList.add('hidden');
});

document.getElementById('loadBtn').addEventListener('click', async () => {
  const urlInput = document.getElementById('playlistUrl').value.trim();
  const fileInput = document.getElementById('playlistFile').files[0];
  const status = document.getElementById('loadStatus');

  if (!urlInput && !fileInput) {
    status.textContent = '❌ กรุณาใส่ลิงก์ หรือเลือกไฟล์';
    status.className = 'status-text status-err';
    return;
  }
  status.textContent = '⏳ กำลังโหลด...';
  status.className = 'status-text';

  try {
    let content = '', type = '';
    
    if (urlInput) {
      type = getExt(urlInput);
      if (!['m3u','m3u8','json','w3u'].includes(type)) {
        status.textContent = '⚠️ รองรับ .m3u/.m3u8/.json/.w3u เท่านั้น';
        status.className = 'status-text status-err';
        return;
      }
      const res = await fetch(urlInput);
      if (!res.ok) throw new Error('ดึงข้อมูลไม่ได้');
      content = await res.text();
    }

    if (fileInput) {
      type = getExt(fileInput.name);
      if (!['m3u','m3u8','json','w3u'].includes(type)) {
        status.textContent = '⚠️ รองรับ .m3u/.m3u8/.json/.w3u เท่านั้น';
        status.className = 'status-text status-err';
        return;
      }
      content = await readFile(fileInput);
    }

    let newChannels = [];
    if (type === 'm3u' || type === 'm3u8') newChannels = parseM3U(content);
    else if (type === 'json') newChannels = parseJSON(content);
    else if (type === 'w3u') newChannels = parseW3U(content);

    if (newChannels.length === 0) {
      status.textContent = '❌ ไม่พบรายการช่องในไฟล์';
      status.className = 'status-text status-err';
      return;
    }

    allChannels = newChannels;
    allGroups.clear();
    allChannels.forEach(ch => allGroups.add(ch.group || 'อื่นๆ'));

    status.textContent = `✅ โหลดสำเร็จ! ${newChannels.length} ช่อง`;
    status.className = 'status-text status-ok';
    
    setTimeout(() => {
      document.getElementById('addModal').classList.add('hidden');
      activeGroup = 'all';
      rebuildCategories();
      renderChannels();
      updateTabCount();
    }, 1200);

  } catch (err) {
    status.textContent = `❌ ผิดพลาด: ${err.message}`;
    status.className = 'status-text status-err';
  }
});

document.getElementById('searchBox').addEventListener('input', (e) => {
  renderChannels(e.target.value);
});

function getExt(url) {
  try { return new URL(url).pathname.split('.').pop().toLowerCase(); }
  catch { return url.split('.').pop().toLowerCase(); }
}
function readFile(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsText(file);
  });
}

function parseM3U(text) {
  const channels = [];
  if (!text.includes('#EXTM3U')) return channels;
  const lines = text.split('\n').filter(L => L.trim());
  let info = null;
  for (let L of lines) {
    L = L.trim();
    if (L.startsWith('#EXTINF:')) {
      const name = L.match(/,(.+)$/)?.[1]?.trim() || 'ช่อง';
      const logo = L.match(/tvg-logo="([^"]+)"/)?.[1] || '';
      const group = L.match(/group-title="([^"]+)"/)?.[1] || 'อื่นๆ';
      info = { name, logo, group, url: '' };
    } else if (!L.startsWith('#') && info) {
      info.url = L;
      channels.push(info);
      info = null;
    }
  }
  return channels;
}

function parseJSON(text) {
  try {
    const d = JSON.parse(text);
    const list = Array.isArray(d) ? d : (d.channels || d.data || d.items || []);
    return list.map((it, i) => ({
      name: it.name || it.title || `ช่อง ${i+1}`,
      url: it.url || it.link || it.stream || '',
      logo: it.logo || it.image || '',
      group: it.group || it.category || 'อื่นๆ'
    }));
  } catch { return []; }
}

function parseW3U(text) {
  try {
    const d = JSON.parse(text);
    const list = d.playlist || d.channels || [];
    return list.map((it, i) => ({
      name: it.name || it.title || `ช่อง ${i+1}`,
      url: it.url || it.streamUrl || '',
      logo: it.logo || it.icon || '',
      group: it.group || 'อื่นๆ'
    }));
  } catch { return parseM3U(text); }
}
